# PR CI for ngx-stripe (library quality Phase 0).
# Contract tests land in a later phase; for now we keep tables generated and the lib build green.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate lanes + build library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Check generated version tables
        run: npm run generate:lanes:check

      - name: Unit tests
        run: npm test

      - name: Build library
        run: npm run build:lib

      - name: Pack smoke (public API in tarball)
        run: npm run pack:smoke
