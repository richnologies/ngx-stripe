# PR CI for ngx-stripe — lanes, Vitest contract tests, pack smoke, docs smoke.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate lanes + build library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Check generated version tables
        run: npm run generate:lanes:check

      - name: Check generated element inventory
        run: npm run generate:elements:check

      - name: Unit tests
        run: npm test

      - name: Build library
        run: npm run build:lib

      - name: Pack smoke (public API in tarball)
        run: npm run pack:smoke

      - name: Pack allowlist
        run: npm run check:pack-allowlist

      - name: Public API snapshot
        run: npm run check:public-api

      - name: Stripe method drift
        run: npm run check:stripe-drift

      - name: Build docs
        run: npm run build:app

      - name: Docs smoke (Playwright)
        run: npx playwright install chromium --with-deps && npm run smoke:docs
