# Production docs site (ngx-stripe.dev) from main.
# Deploy Preview / branch deploys are skipped — no PR Netlify checks.

[build]
  command = "npm ci && npm run build:app"
  publish = "dist/ngx-stripe-docs/browser"

[build.environment]
  NODE_VERSION = "22"

# Skip PR deploy previews (exit 0 = cancel this build context).
[context.deploy-preview]
  ignore = "exit 0"

# Skip non-main branch deploys.
[context.branch-deploy]
  ignore = "exit 0"
