# Static server for the prerendered docs site. Mounted as /etc/nginx/conf.d/default.conf.
# TLS, HSTS and HTTP→HTTPS are handled by nginx-proxy in front of this container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # One canonical host: www goes to the apex.
    if ($host = www.ngx-stripe.dev) {
        return 301 https://ngx-stripe.dev$request_uri;
    }

    charset utf-8;
    charset_types text/plain text/css text/xml application/javascript application/json application/xml;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    # Bundles carry a content hash in their name (main-CB3DI5ZT.js, chunk--LVbwdCy.js), so they never change.
    location ~* "^/[a-z]+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        # /docs/payment-element is served from docs/payment-element/index.html with no redirect, so
        # the URL stays the one in the canonical tag and the sitemap. A route that was not
        # prerendered gets the client-rendered shell, which the Angular router then resolves.
        try_files $uri $uri/index.html /index.csr.html;
    }
}
